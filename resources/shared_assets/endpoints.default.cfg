; Public endpoints compiled into the app.
;
; Only PUBLIC values ever appear here. No key, token or secret belongs in this
; file — see env.example and docs/BACKEND.md.
;
; The content host. Chapters are fetched from <base_url>/<chapter_id>/ and
; every package is verified against the public signing key beside this file
; before anything is activated.
;
; A build with base_url empty runs entirely offline on the chapter bundled
; in the APK; filling it in turns chapter downloads on.

[content]
base_url="https://raz.fibeso.com/content"
allow_unsigned=false

[api]
base_url="https://raz.fibeso.com/api"
